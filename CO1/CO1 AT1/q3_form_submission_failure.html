<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 3: Secure Student Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Portal Authentication</h1>
    <p>Sign in to access your student dashboard.</p>
  </header>

  <main class="container">
    <section class="card login-card" aria-labelledby="login-heading">
      <h2 id="login-heading">Account Login</h2>

      <!-- Corrected Implementation: POST method, HTTPS, type="submit" button -->
      <form action="https://symposium.simats.edu/api/login" method="POST" autocomplete="on">
        
        <input type="hidden" name="csrf_token" value="c3bf81079d2a4e9b8f2c">

        <div class="form-group">
          <label for="username">Username or Email <span class="required">*</span></label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            autocomplete="username" 
            placeholder="Enter your student ID or email"
            aria-required="true">
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password" 
            placeholder="Enter your password"
            aria-required="true">
        </div>

        <div class="form-actions">
          <button type="submit" id="loginBtn">Login</button>
        </div>

      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 SIMATS Engineering. All rights reserved.</p>
  </footer>

</body>
</html>
