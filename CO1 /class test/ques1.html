
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Symposium Registration</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }
        section {
            background: white;
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }
        input {
            padding: 8px;
            margin: 8px;
        }
        button {
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
        footer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Online Symposium</h1>
    </header>
    <main>
        <section>
            <h2>Registration Form</h2>
            <form action="/register" method="POST">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>
    <footer>Symposium Portal</footer>
</body>
</html>
