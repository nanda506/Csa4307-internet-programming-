
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Website</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }
        main {
            padding: 20px;
        }
        section {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }
        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Company</h1>
    </header>
    <main>
        <section>
            <h2>About Us</h2>
            <p>We provide quality services to our customers.</p>
        </section>
    </main>
    <footer>
        <p>Copyright 2026 Company</p>
    </footer>
</body>
</html>
